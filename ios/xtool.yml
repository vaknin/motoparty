version: 1
# xtool prefixes this with a team-specific ID when signing with a free Apple
# ID (e.g. XTL-1234.com.vaknin.motoparty), so it never clashes across accounts.
bundleID: com.vaknin.motoparty
product: Motoparty
# Merged over xtool's generated Info.plist (background audio, mic, local
# network, Bonjour, speech, ATS local networking).
infoPath: Info.plist
# The home-screen icon: one 1024x1024 PNG without alpha (no asset catalog);
# redrawn by scripts/make-icon.sh.
iconPath: Icon.png
