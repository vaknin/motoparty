[project]
name = "motoparty-peer"
version = "0.1.0"
description = "Desktop peer (host or client) speaking the Motoparty wire protocol, for bench tests"
readme = "README.md"
authors = [
    { name = "Kivan", email = "vaknins33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5.6",
    "zeroconf>=0.151.3",
]

[project.scripts]
motoparty-peer = "motoparty_peer.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
